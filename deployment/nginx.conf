# Cache only successful immutable assets. A missing chunk must not be cached for a year.
map "$status:$uri" $cache_control {
    default "no-store";
    ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
}

# Static SPA example. TLS/HSTS belong to the ingress.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Cache-Control $cache_control always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Replace ONLY these API locations with the approved BFF upstream/proxy headers.
    # Fail closed until configured; API requests must never return the SPA HTML.
    location = /api { return 503; }
    location ^~ /api/ { return 503; }

    location /assets/ {
        try_files $uri =404;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location = /mockServiceWorker.js { return 404; }
    location ~* \.(?:js|css|map|json|png|jpg|svg|ico|woff2?)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
